# spire configuration
#
# This file is plain `key = value` lines. Lines starting with # are
# comments. Quotes around a value are optional but let you keep
# leading/trailing spaces. Shell commands to run at startup (aliases,
# abbreviations, completions, functions) go in ~/.config/spire/config.spire.

# ---- prompt -----------------------------------------------------------
# %n user   %m host   %M full host   %~ cwd (~ shortened)   %/ full cwd
# %. last cwd component   %g git branch   %G (branch*) with dirty marker
# %? last exit status   %E "✘ N" only after a failure   %j / %J job count
# %c duration of the last command if slow   %T %* %t time   %D{strftime}
# %v python virtualenv   %h history number   %# '#' for root else '$'
# %F{color}...%f foreground   %K{color}...%k background   %B %b bold
# %U %u underline   %(?.ok.failed) conditional (also %(j...) %(#...))
# %% literal %
prompt  = "%F{cyan}%n%f@%F{cyan}%m%f %F{yellow}%~%f %F{brightblack}%G%f%(?.%F{green}.%F{red})▲❯%f "
rprompt = "%(?..%F{red}✘ %?%f )%F{yellow}%c%f%F{brightblack}%J%f"
prompt.continuation = "%F{brightblack}  …%f "
# only show %c for commands slower than this many milliseconds
prompt.duration_threshold = 2000
# mark output that didn't end in a newline with a dim ⏎ (like fish/zsh)
prompt.missing_newline_marker = yes

# ---- syntax highlighting colors ---------------------------------------
# any of: black red green yellow blue magenta cyan white default
# brightblack ... brightwhite, gray, orange, purple, a 256-color number,
# #rrggbb truecolor, attributes bold underline italic dim reverse, and
# prefixes like "bold-red" or "underline-cyan". Or run `colorscheme NAME`.
color.command         = green
color.command_invalid = red
color.builtin         = blue
color.function        = brightblue
color.string          = yellow
color.variable        = cyan
color.operator        = magenta
color.redirect        = brightmagenta
color.comment         = brightblack
color.keyword         = blue
color.number          = magenta
color.path            = white
color.array           = brightmagenta
color.flag            = brightcyan
color.escape          = brightcyan
color.suggestion      = brightblack
color.text            = default

# completion menu
color.description     = brightblack
color.selection       = reverse
color.completion      = default

# ---- behavior -------------------------------------------------------------
# type a directory name alone to cd into it
autocd = yes
# fish-style inline suggestions from history
autosuggest = yes
# underline arguments that are existing files
highlight.valid_paths = yes
# learn options for completion from `CMD --help` (native binaries only)
complete.parse_help = yes

# ---- history ------------------------------------------------------------
history.size = 5000

# ---- modules --------------------------------------------------------
# comma-separated list of modules to source at startup from
# ~/.config/spire/modules/<name>.spire. Starter modules: "aliases"
# (ll, .., colorized ls/grep/diff, ...), "git" (helpers, abbreviations and
# completions) and "fish" (fish-compatible helpers like fish_add_path).
modules = aliases, git
